<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Focus 5 Coaching</title>
<style>
  :root{
    --bb-blue:#0046be; --bb-navy:#003087; --bb-yellow:#ffe000;
    --green:#1a9d4b; --yellow:#e0a100; --red:#d43b2f;
    --bg:#f2f4f8; --card:#ffffff; --ink:#1a1a2e; --muted:#6b7280;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg);color:var(--ink);padding-bottom:40px;}
  header{background:var(--bb-blue);color:#fff;padding:18px 18px 16px;position:sticky;top:0;z-index:10;
    box-shadow:0 2px 8px rgba(0,0,0,.15);}
  header .brand{font-size:12px;letter-spacing:.12em;text-transform:uppercase;opacity:.85;}
  header h1{margin:2px 0 2px;font-size:22px;font-weight:800;}
  header .week{font-size:14px;font-weight:600;color:var(--bb-yellow);}
  .progress-wrap{max-width:640px;margin:14px auto 0;padding:0 18px;}
  .bar{height:10px;background:#e3e7ee;border-radius:6px;overflow:hidden;}
  .bar>span{display:block;height:100%;background:var(--green);width:0;transition:width .3s;}
  .progress-label{font-size:13px;color:var(--muted);margin-top:6px;font-weight:600;}
  main{max-width:640px;margin:0 auto;padding:8px 14px;}
  .section-title{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;
    color:var(--muted);margin:22px 6px 8px;}
  .card{background:var(--card);border-radius:14px;box-shadow:0 1px 3px rgba(0,0,0,.08);
    margin-bottom:10px;overflow:hidden;}
  .item{display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;
    border-left:5px solid transparent;}
  .item.red{border-left-color:var(--red);}
  .item.yellow{border-left-color:var(--yellow);}
  .item.green{border-left-color:var(--green);}
  .check{flex:0 0 26px;width:26px;height:26px;border-radius:50%;border:2px solid #c3c9d4;
    display:flex;align-items:center;justify-content:center;transition:all .15s;background:#fff;}
  .item.done .check{background:var(--green);border-color:var(--green);}
  .check svg{width:15px;height:15px;stroke:#fff;stroke-width:3.5;fill:none;
    opacity:0;transition:opacity .15s;}
  .item.done .check svg{opacity:1;}
  .body{flex:1;min-width:0;}
  .metric{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);}
  .who{font-size:17px;font-weight:700;margin-top:1px;}
  .item.done .who{text-decoration:line-through;color:var(--muted);}
  .val{flex:0 0 auto;text-align:right;font-weight:800;font-size:16px;}
  .val.red{color:var(--red);} .val.yellow{color:var(--yellow);} .val.green{color:var(--green);}
  .val small{display:block;font-size:11px;font-weight:600;color:var(--muted);}
  .green-list .item{cursor:default;}
  .empty{padding:14px 16px;color:var(--muted);font-size:14px;}
  .flag{background:#fff8e1;border:1px solid #ffe082;border-radius:12px;padding:12px 14px;
    font-size:13px;color:#6b5900;margin:16px 6px 4px;line-height:1.4;}
  footer{text-align:center;color:var(--muted);font-size:12px;margin-top:24px;}
</style>
</head>
<body>
<script>
/* ============================================================
   DATA — regenerated each week. To update: change weekId +
   weekLabel and rebuild `metrics`. A new weekId auto-resets
   all checkboxes (state is stored per weekId in localStorage).
   colors: "green" = meets goal | "yellow" = missed, improving
           "red"   = missed, flat/worse. Greens file under
           "No coaching needed"; red/yellow become checklist.
   ============================================================ */
const DATA = {
  weekId: "2026-07-W3",
  weekLabel: "July · Week 3",
  metrics: [
    { name: "5-Star",        goal: "4.75",   people: [
        { who:"Robert", value:"5.0", color:"green" },
        { who:"Robin",  value:"5.0", color:"green" } ] },
    { name: "Revenue / hr",  goal: "$610",   people: [
        { who:"Mariah", value:"$495", color:"yellow" } ] },
    { name: "TPH",           goal: "3.0",    people: [
        { who:"Jack",   value:"1.4", color:"yellow" },
        { who:"Liles",  value:"1.6", color:"red" },
        { who:"Robert", value:"1.8", color:"red" },
        { who:"Robin",  value:"2.1", color:"yellow" },
        { who:"Emily",  value:"1.7", color:"yellow" } ] },
    { name: "PM Efficiency", goal: "≤ $3,000", people: [
        { who:"Jack",    value:"$8,234", color:"red" },
        { who:"Mariah",  value:"$6,598", color:"yellow" },
        { who:"Liles",   value:"$4,134", color:"red" },
        { who:"Biatriz", value:"$6,052", color:"red" },
        { who:"Emily",   value:"$2,593", color:"green" } ] },
    { name: "BP Efficiency", goal: "≤ $6,000", people: [
        { who:"Liles",    value:"$5,711",  color:"green" },
        { who:"Emily",    value:"$8,132",  color:"yellow" },
        { who:"Robert",   value:"$20,082", color:"yellow" },
        { who:"Jack",     value:"$30,517", color:"red" },
        { who:"Lixandra", value:"$0",      color:"red" } ] },
    { name: "Warranty",      goal: "11%",    people: [
        { who:"Lixandra", value:"50.0%", color:"green" },
        { who:"Mariah",   value:"5.7%",  color:"yellow" } ] },
    { name: "PC Basket",     goal: "$140",   people: [
        { who:"Jack",     value:"$21", color:"red" },
        { who:"Emily",    value:"$80", color:"yellow" },
        { who:"Lixandra", value:"$0",  color:"red" } ] },
    { name: "M365",          goal: "25%",    people: [
        { who:"Robin",  value:"29.4%", color:"green" },
        { who:"Jack",   value:"0.0%",  color:"red" },
        { who:"Robert", value:"30.0%", color:"green" },
        { who:"Liles",  value:"25.0%", color:"green" } ] },
    { name: "HT Basket",     goal: "$190",   people: [
        { who:"Emily",  value:"$262", color:"green" },
        { who:"Mariah", value:"$89",  color:"red" } ] },
    { name: "Audio",         goal: "20%",    people: [
        { who:"Robert", value:"18.5%",  color:"red" },
        { who:"Emily",  value:"16.7%",  color:"red" },
        { who:"Mariah", value:"0.0%",   color:"red" },
        { who:"Robin",  value:"200%",   color:"green" } ] }
  ],
  // Early-month attach %s / baskets built on 1-2 transactions can look
  // inflated (e.g. Robin Audio 200%, HT Basket leaders). Coach on trend.
  flag: "Heads up: some attach %s and baskets come from only 1–2 transactions this MTD and can look inflated (e.g. Robin's Audio 200%). Coach the trend, not the single number."
};
</script>

<header>
  <div class="brand">Store 0885 · Port Richey</div>
  <h1>Focus 5 Coaching</h1>
  <div class="week" id="weekLabel"></div>
</header>
<div class="progress-wrap">
  <div class="bar"><span id="barFill"></span></div>
  <div class="progress-label" id="progLabel"></div>
</div>
<main id="app"></main>
<footer>Checkmarks reset automatically each new week.</footer>

<script>
(function(){
  const KEY = "focus5:" + DATA.weekId;
  let state = {};
  try { state = JSON.parse(localStorage.getItem(KEY) || "{}"); } catch(e){ state = {}; }
  const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} };

  document.getElementById("weekLabel").textContent = DATA.weekLabel;

  // Build coaching (red/yellow) and cleared (green) lists
  const coaching = [];
  const cleared = [];
  DATA.metrics.forEach(m => {
    m.people.forEach(p => {
      const row = { id: (m.name + "|" + p.who).replace(/\s+/g,"_"),
                    metric: m.name, who: p.who, value: p.value, color: p.color };
      (p.color === "green" ? cleared : coaching).push(row);
    });
  });

  const check = `<span class="check"><svg viewBox="0 0 24 24"><polyline points="4 12 10 18 20 6"/></svg></span>`;
  const app = document.getElementById("app");

  function renderVal(r){ return `<div class="val ${r.color}">${r.value}</div>`; }

  // Flag
  if (DATA.flag){
    const f = document.createElement("div");
    f.className = "flag"; f.textContent = DATA.flag;
    app.appendChild(f);
  }

  // Coaching checklist
  const t1 = document.createElement("div");
  t1.className = "section-title";
  t1.textContent = "Needs coaching (" + coaching.length + ")";
  app.appendChild(t1);

  const card1 = document.createElement("div");
  card1.className = "card";
  if (!coaching.length){
    card1.innerHTML = `<div class="empty">Nothing flagged — everyone hit goal. 🎉</div>`;
  } else {
    coaching.forEach(r => {
      const el = document.createElement("div");
      el.className = "item " + r.color + (state[r.id] ? " done" : "");
      el.innerHTML = `${check}
        <div class="body"><div class="metric">${r.metric} · goal ${goalFor(r.metric)}</div>
        <div class="who">${r.who}</div></div>${renderVal(r)}`;
      el.addEventListener("click", () => {
        state[r.id] = !state[r.id];
        el.classList.toggle("done", !!state[r.id]);
        save(); updateProgress();
      });
      card1.appendChild(el);
    });
  }
  app.appendChild(card1);

  // Cleared / no coaching needed
  const t2 = document.createElement("div");
  t2.className = "section-title";
  t2.textContent = "No coaching needed — hit goal (" + cleared.length + ")";
  app.appendChild(t2);
  const card2 = document.createElement("div");
  card2.className = "card green-list";
  if (!cleared.length){
    card2.innerHTML = `<div class="empty">No greens this week.</div>`;
  } else {
    cleared.forEach(r => {
      const el = document.createElement("div");
      el.className = "item green";
      el.innerHTML = `<span class="check" style="background:var(--green);border-color:var(--green)">
        <svg viewBox="0 0 24 24" style="opacity:1"><polyline points="4 12 10 18 20 6"/></svg></span>
        <div class="body"><div class="metric">${r.metric}</div>
        <div class="who">${r.who}</div></div>${renderVal(r)}`;
      card2.appendChild(el);
    });
  }
  app.appendChild(card2);

  function goalFor(name){
    const m = DATA.metrics.find(x => x.name === name);
    return m ? m.goal : "";
  }

  function updateProgress(){
    const done = coaching.filter(r => state[r.id]).length;
    const total = coaching.length;
    const pct = total ? Math.round(done/total*100) : 100;
    document.getElementById("barFill").style.width = pct + "%";
    document.getElementById("progLabel").textContent =
      total ? (done + " of " + total + " coached · " + pct + "%") : "All clear";
  }
  updateProgress();
})();
</script>
</body>
</html>
